<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUS Antigravity Lab - SeanL-MSBA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px -6px rgba(0, 0, 0, 0.12);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    h1 span {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 1rem;
      color: #64748b;
      margin-bottom: 2rem;
      font-weight: 400;
    }
    .meta-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      border: 1px solid #edf2f7;
      text-align: left;
      font-size: 0.875rem;
      color: #475569;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
    }
    .meta-row:not(:last-child) {
      border-bottom: 1px solid #e2e8f0;
    }
    .meta-label {
      font-weight: 600;
      color: #334155;
    }
    .meta-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      Status: Initial Environment Verification Passed ✅
    </div>
    <h1>Hi NUS Antigravity Hackathon!<br>I am <span>SeanL-MSBA</span></h1>
    <p class="subtitle">NUS MSBA Build with Antigravity Hands-on Lab (2026-11-23)</p>
    
    <div class="meta-box">
      <div class="meta-row">
        <span class="meta-label">Track</span>
        <span class="meta-val">Track 2: Singapore Retail Sales Index</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Deliverable Path</span>
        <span class="meta-val">submissions/SeanL-MSBA/</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Modality</span>
        <span class="meta-val">Google Antigravity Agentic IDE</span>
      </div>
    </div>
  </div>
</body>
</html>
